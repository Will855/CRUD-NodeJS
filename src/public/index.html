<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Autenticación</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <!-- Sección Login/Logout -->
        <div id="authSection" class="mb-6">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Inicio de Sesión</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-2">Correo electrónico</label>
                    <input type="email" id="email" name="email"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Contraseña</label>
                    <input type="password" id="password" name="email"
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit"
                    class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors">
                    Iniciar Sesión
                </button>
            </form>
            <button id="logoutBtn"
                class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition-colors hidden mt-4">
                Cerrar Sesión
            </button>
        </div>

        <!-- Sección Usuario -->
        <div id="userInfo" class="hidden mb-6">
            <h2 class="text-xl font-semibold mb-3 text-gray-800">Información del Usuario</h2>
            <div class="bg-gray-50 p-4 rounded-lg">
                <p id="userName" class="text-gray-600"></p>
                <p id="userEmail" class="text-gray-600"></p>
            </div>
        </div>

        <!-- Sección Métodos de Pago -->
        <div id="paymentSection" class="hidden">
            <h2 class="text-xl font-semibold mb-3 text-gray-800">Métodos de Pago</h2>
            <div class="space-y-3">
                <div class="flex gap-2">
                    <input type="text" id="newPaymentMethod" class="flex-1 px-4 py-2 border rounded-lg"
                        placeholder="Nuevo método de pago">
                    <button id="addPaymentBtn"
                        class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors">
                        Agregar
                    </button>
                </div>
                <select id="paymentMethods" class="w-full px-4 py-2 border rounded-lg bg-white">
                    <option value="">Seleccionar método de pago</option>
                </select>
            </div>
        </div>

        <!-- Mensajes de Estado -->
        <div id="message" class="mt-4 text-center"></div>
    </div>

<script type="module" src="app.js"></script>
</body>

</html>
